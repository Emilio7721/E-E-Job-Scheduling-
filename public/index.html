<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>E&E Job Scheduling</title>
  <meta name="description" content="Job scheduling, venues and team chat for E&E">
  <meta name="theme-color" content="#ffffff" id="meta-theme">
  <script>
    // Apply the saved theme before styles load to avoid a flash of the wrong mode.
    (function () {
      var t = localStorage.getItem('ee-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.currentScript.previousElementSibling.content = dark ? '#101114' : '#ffffff';
    })();
  </script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="E&E Jobs">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"></div>
  <script src="/app.js"></script>
</body>
</html>
